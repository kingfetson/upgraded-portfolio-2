<!-- index.html -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Portfolio Generator | Professional Portfolio Kit</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- EDITOR SIDEBAR -->
    <aside class="editor-sidebar" id="editorSidebar">
      <div class="sidebar-header">
        <h2><i class="fas fa-magic"></i> Portfolio Builder</h2>
        <p class="sidebar-subtitle">Edit your data → Live preview</p>
        <button class="toggle-sidebar-btn" id="toggleSidebar"><i class="fas fa-chevron-left"></i></button>
      </div>

      <div class="editor-content" id="editorContent">
        <!-- Personal Info -->
        <div class="form-section">
          <h3><i class="fas fa-user"></i> Personal Info</h3>
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="nameInput" placeholder="e.g., Sarah Johnson">
          </div>
          <div class="form-group">
            <label>Title / Profession *</label>
            <input type="text" id="titleInput" placeholder="e.g., Senior Product Designer">
          </div>
          <div class="form-group">
            <label>Bio / Summary</label>
            <textarea id="bioInput" rows="3" placeholder="Short bio for recruiters..."></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Location</label>
              <input type="text" id="locationInput" placeholder="New York, NY">
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="emailInput" placeholder="sarah@example.com">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Phone / WhatsApp</label>
              <input type="text" id="phoneInput" placeholder="+1234567890">
            </div>
          </div>
          <div class="form-group">
            <label>Profile Image</label>
            <input type="text" id="imageUrlInput" placeholder="https://...">
            <input type="file" id="profileUpload" accept="image/*" class="file-input">
          </div>
        </div>

        <!-- Skills -->
        <div class="form-section">
          <h3><i class="fas fa-code"></i> Skills</h3>
          <div class="tag-input-group">
            <input type="text" id="skillInput" placeholder="e.g., UX Research">
            <button id="addSkillBtn" class="btn-small">+ Add</button>
          </div>
          <div class="tags-container" id="skillsContainer"></div>
        </div>

        <!-- Projects -->
        <div class="form-section">
          <h3><i class="fas fa-project-diagram"></i> Projects</h3>
          <div id="projectsList"></div>
          <button id="addProjectBtn" class="btn-outline btn-full">+ Add Project</button>
        </div>

        <!-- Social Links -->
        <div class="form-section">
          <h3><i class="fas fa-share-alt"></i> Social Links</h3>
          <div id="socialList"></div>
          <button id="addSocialBtn" class="btn-outline btn-full">+ Add Social</button>
        </div>

        <!-- Documents -->
        <div class="form-section">
          <h3><i class="fas fa-file-pdf"></i> Documents</h3>
          <div class="form-group">
            <label>CV (PDF)</label>
            <input type="file" id="cvUpload" accept=".pdf" class="file-input">
            <small id="cvFileName"></small>
          </div>
          <div class="form-group">
            <label>Resume (PDF)</label>
            <input type="file" id="resumeUpload" accept=".pdf" class="file-input">
            <small id="resumeFileName"></small>
          </div>
        </div>

        <!-- Customization -->
        <div class="form-section">
          <h3><i class="fas fa-palette"></i> Customization</h3>
          <div class="form-group">
            <label>Color Theme</label>
            <select id="themeSelect">
              <option value="default">Default (Indigo)</option>
              <option value="modern">Modern (Pink)</option>
              <option value="creative">Creative (Amber)</option>
              <option value="minimal">Minimal (Slate)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Layout Style</label>
            <select id="layoutSelect">
              <option value="modern">Modern (Cards)</option>
              <option value="minimal">Minimal (Clean)</option>
              <option value="creative">Creative (Bold)</option>
            </select>
          </div>
        </div>

        <!-- Actions -->
        <div class="form-actions">
          <button id="resetDataBtn" class="btn-danger"><i class="fas fa-trash"></i> Reset All</button>
          <button id="exportConfigBtn" class="btn-outline"><i class="fas fa-download"></i> Export Config</button>
        </div>
        <p class="auto-save-note"><i class="fas fa-save"></i> Auto-saves to browser storage</p>
      </div>
    </aside>

    <!-- PORTFOLIO PREVIEW -->
    <main class="preview-area">
      <div class="sticky-toolbar">
        <button id="stickyDownloadCV" class="btn-primary"><i class="fas fa-download"></i> Download CV</button>
        <button id="whatsappStickyBtn" class="btn-whatsapp"><i class="fab fa-whatsapp"></i> WhatsApp</button>
        <button id="toggleSidebarMobile" class="btn-outline mobile-only"><i class="fas fa-edit"></i> Edit</button>
      </div>
      <div id="portfolioPreview" class="portfolio-container"></div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
